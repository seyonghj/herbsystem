<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Herb Map — HerbID Iloilo</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    .map-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - var(--nav-h));
    }

    /* ── SIDEBAR ── */
    .map-sidebar {
      background: var(--white);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-title {
      font-size: 14px; font-weight: 600; color: var(--green-dark);
      display: flex; align-items: center; gap: 7px; margin-bottom: 8px;
    }
    .sidebar-title i { color: var(--green-main); font-size: 16px; }
    .sidebar-search { position: relative; }
    .sidebar-search i {
      position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 15px; pointer-events: none;
    }
    .sidebar-search input {
      width: 100%; padding: 8px 10px 8px 30px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 13px; font-family: 'DM Sans', sans-serif;
      color: var(--text-primary); background: var(--bg);
    }
    .sidebar-search input:focus {
      outline: none; border-color: var(--green-main);
      box-shadow: 0 0 0 3px rgba(34,160,107,0.1);
    }

    /* filter pills */
    .filter-pills {
      padding: 0.75rem 1.25rem;
      display: flex; gap: 6px; flex-wrap: wrap;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .pill {
      font-size: 11px; font-weight: 500; padding: 4px 10px;
      border-radius: 99px; cursor: pointer; border: 1px solid var(--border);
      background: var(--white); color: var(--text-muted);
      transition: all 0.15s; white-space: nowrap;
    }
    .pill.active { background: var(--green-main); color: #fff; border-color: var(--green-main); }
    .pill:hover:not(.active) { background: var(--green-pale); color: var(--green-dark); border-color: var(--green-main); }

    /* herb list */
    .herb-list { overflow-y: auto; flex: 1; padding: 0.5rem 0; }
    .herb-list-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 1.25rem; cursor: pointer;
      transition: background 0.15s; border-bottom: 1px solid var(--border);
    }
    .herb-list-item:last-child { border-bottom: none; }
    .herb-list-item:hover { background: var(--green-pale); }
    .herb-list-item.active { background: var(--green-pale); border-left: 3px solid var(--green-main); }
    .herb-list-emoji { font-size: 22px; flex-shrink: 0; width: 32px; text-align: center; }
    .herb-list-info { flex: 1; min-width: 0; }
    .herb-list-local { font-size: 13px; font-weight: 600; color: var(--green-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .herb-list-sci { font-size: 11px; color: var(--text-muted); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .herb-list-loc { font-size: 10px; color: var(--text-light); margin-top: 1px; display: flex; align-items: center; gap: 3px; }
    .herb-list-loc i { font-size: 11px; color: var(--green-main); }
    .pin-btn {
      flex-shrink: 0; background: none; border: 1.5px solid var(--border);
      border-radius: 8px; padding: 5px 8px; cursor: pointer;
      font-size: 11px; font-weight: 600; font-family: 'DM Sans', sans-serif;
      color: var(--text-muted); transition: all 0.15s;
      display: flex; align-items: center; gap: 4px;
    }
    .pin-btn:hover { background: var(--green-pale); border-color: var(--green-main); color: var(--green-dark); }
    .pin-btn.pinned { background: var(--green-main); border-color: var(--green-main); color: #fff; }
    .pin-btn i { font-size: 13px; }

    /* MAP */
    #map { width: 100%; height: 100%; z-index: 1; }

    /* CUSTOM MARKER */
    .herb-marker {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--green-main); border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; cursor: pointer; transition: transform 0.15s;
    }
    .herb-marker:hover { transform: scale(1.15); }
    .herb-marker.selected {
      background: var(--green-dark); transform: scale(1.2);
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }

    /* PINNING MODE banner */
    .pin-mode-banner {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 500; background: #0a4a35; color: #fff;
      padding: 10px 18px; border-radius: 99px;
      font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      display: none; align-items: center; gap: 8px; white-space: nowrap;
    }
    .pin-mode-banner.active { display: flex; }
    .pin-mode-banner i { font-size: 16px; color: #7eebb5; }
    .pin-cancel {
      margin-left: 10px; background: rgba(255,255,255,0.15);
      border: none; color: #fff; padding: 3px 10px; border-radius: 99px;
      font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif;
    }
    .pin-cancel:hover { background: rgba(255,255,255,0.25); }

    /* POPUP */
    .leaflet-popup-content-wrapper {
      border-radius: 14px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15) !important;
      padding: 0 !important; overflow: hidden;
      font-family: 'DM Sans', sans-serif !important;
    }
    .leaflet-popup-content { margin: 0 !important; width: 240px !important; }
    .leaflet-popup-tip-container { margin-top: -1px; }
    .popup-header {
      background: var(--green-dark); padding: 12px 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .popup-emoji { font-size: 28px; }
    .popup-local { font-size: 14px; font-weight: 600; color: #fff; line-height: 1.2; }
    .popup-sci { font-size: 11px; color: rgba(255,255,255,0.55); font-style: italic; margin-top: 2px; }
    .popup-body { padding: 12px 14px; }
    .popup-row { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; display: flex; gap: 6px; }
    .popup-row i { color: var(--green-main); font-size: 13px; flex-shrink: 0; margin-top: 1px; }
    .popup-row span { color: var(--text-primary); }
    .popup-coords { font-size: 11px; color: var(--text-light); font-family: monospace; margin-bottom: 8px; }
    .popup-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
    .popup-tag { font-size: 10px; padding: 2px 8px; border-radius: 99px; background: var(--green-pale); color: var(--green-dark); font-weight: 500; }
    .popup-actions { display: flex; gap: 6px; }
    .popup-btn {
      flex: 1; padding: 8px; background: var(--green-main); color: #fff; border: none;
      border-radius: var(--radius-sm); font-size: 12px; font-weight: 500;
      font-family: 'DM Sans', sans-serif; cursor: pointer; text-align: center;
      text-decoration: none; transition: background 0.15s; display: block;
    }
    .popup-btn:hover { background: var(--green-mid); }
    .popup-btn-remove {
      padding: 8px 10px; background: #fee2e2; color: #991b1b; border: none;
      border-radius: var(--radius-sm); font-size: 12px; font-weight: 500;
      font-family: 'DM Sans', sans-serif; cursor: pointer;
      transition: background 0.15s;
    }
    .popup-btn-remove:hover { background: #fecaca; }

    /* saving indicator */
    .saving-dot {
      display: none; width: 8px; height: 8px; border-radius: 50%;
      background: var(--green-main); animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* count badge */
    .count-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 20px; height: 20px; padding: 0 5px;
      background: var(--green-main); color: #fff;
      font-size: 11px; font-weight: 600; border-radius: 99px;
      margin-left: auto;
    }

    /* map cursor when pinning */
    .map-layout.pinning #map { cursor: crosshair; }

    /* Lemery badge */
    .lemery-badge {
      position: absolute; bottom: 14px; left: 14px; z-index: 400;
      background: rgba(10,74,53,0.88); color: #fff;
      font-size: 11px; font-weight: 600; font-family: 'DM Sans', sans-serif;
      padding: 5px 11px; border-radius: 99px;
      display: flex; align-items: center; gap: 5px;
      pointer-events: none; backdrop-filter: blur(4px);
    }
    .lemery-badge i { font-size: 13px; color: #7eebb5; }

    /* MOBILE */
    @media (max-width: 768px) {
      .map-layout { grid-template-columns: 1fr; position: relative; }
      .map-sidebar {
        position: absolute; bottom: 0; left: 0; right: 0; z-index: 400;
        height: 45vh; border-right: none;
        border-top: 1px solid var(--border);
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
        transform: translateY(100%);
        transition: transform 0.3s cubic-bezier(.4,0,.2,1);
      }
      .map-sidebar.open { transform: translateY(0); }
      #map { height: calc(100vh - var(--nav-h)); }
      .map-sidebar::before {
        content: ''; display: block; width: 36px; height: 4px;
        background: var(--border); border-radius: 2px;
        margin: 8px auto 4px; flex-shrink: 0;
      }
    }

    .map-toggle-btn {
      display: none !important;
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      z-index: 500; background: var(--green-dark); color: #fff;
      padding: 10px 20px; border-radius: 99px; border: none;
      font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif;
      cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      align-items: center; gap: 7px;
    }
    @media (max-width: 768px) {
      .map-toggle-btn { display: flex !important; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <a href="index.html" class="nav-brand">
    <div class="nav-brand-icon"><i class="ti ti-leaf"></i></div>
    <div class="nav-brand-text">
      <strong>HerbID Iloilo</strong>
      <span>NISU Lemery Campus</span>
    </div>
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li>
    <li><a href="herbs.html">Herb Database</a></li>
    <li><a href="identify.html">Identify Herb</a></li>
    <li><a href="map.html" class="active">Map</a></li>
    <li><a href="about.html">About</a></li>
  </ul>
  <button class="nav-hamburger" onclick="document.getElementById('navLinks').classList.toggle('open')" aria-label="Menu">
    <i class="ti ti-menu-2"></i>
  </button>
</nav>

<div class="map-layout" id="mapLayout">

  <!-- SIDEBAR -->
  <aside class="map-sidebar" id="mapSidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">
        <i class="ti ti-map-pin"></i> Herb Locations
        <div class="saving-dot" id="savingDot"></div>
        <span class="count-badge" id="countBadge">—</span>
      </div>
      <div class="sidebar-search">
        <i class="ti ti-search"></i>
        <input type="text" id="sidebarSearch" placeholder="Search herbs…" oninput="filterList()" />
      </div>
    </div>

    <div class="filter-pills" id="filterPills">
      <div class="pill active" onclick="setFilter('')">All</div>
      <div class="pill" onclick="setFilter('fever')">Fever</div>
      <div class="pill" onclick="setFilter('wound')">Wound</div>
      <div class="pill" onclick="setFilter('pain')">Pain</div>
      <div class="pill" onclick="setFilter('digestive')">Digestive</div>
      <div class="pill" onclick="setFilter('respiratory')">Respiratory</div>
      <div class="pill" onclick="setFilter('skin')">Skin</div>
    </div>

    <div class="herb-list" id="herbList">
      <div style="padding:2rem;text-align:center"><div class="spinner"></div></div>
    </div>
  </aside>

  <!-- MAP -->
  <div style="position:relative;flex:1">
    <div id="map"></div>
    <div class="lemery-badge">
      <i class="ti ti-map-pin"></i> Lemery, Iloilo
    </div>
    <div class="pin-mode-banner" id="pinBanner">
      <i class="ti ti-map-pin"></i>
      <span id="pinBannerText">Click anywhere on the map to pin the location</span>
      <button class="pin-cancel" onclick="cancelPinMode()">Cancel</button>
    </div>
  </div>

</div>

<!-- Mobile toggle -->
<button class="map-toggle-btn" id="toggleBtn" onclick="toggleSidebar()">
  <i class="ti ti-list"></i> <span id="toggleLabel">Show herb list</span>
</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
  import { db, collection, getDocs } from './js/firebase-config.js';
  import {
    doc, updateDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { initNavAuth } from './js/nav-auth.js';
  initNavAuth();
  // ── Lemery, Iloilo — correct coordinates (11.227°N, 122.925°E) ──
  const LEMERY_CENTER = [11.227, 122.925];

  // ── Bounding box around Lemery municipality ──
  const LEMERY_BOUNDS = L.latLngBounds(
    [11.130, 122.820],   // SW corner
    [11.330, 123.020]    // NE corner
  );

  const map = L.map('map', {
    center: LEMERY_CENTER,
    zoom: 13,
    minZoom: 11,
    maxZoom: 17,
    maxBounds: LEMERY_BOUNDS,
    maxBoundsViscosity: 1.0,
  });

  // ── Satellite tile layer (Esri — no API key required) ──
  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics',
      maxZoom: 17,
    }
  ).addTo(map);

  // ── Hardcoded Lemery, Iloilo boundary polygon ──
  // Approximate boundary based on the correct coordinates (11.23°N, 122.93°E)
  // Replace these with the exact OSM export if you have it
  const LEMERY_BORDER = [
    [11.330, 122.880],
    [11.320, 122.920],
    [11.310, 122.960],
    [11.295, 122.990],
    [11.275, 123.010],
    [11.250, 123.018],
    [11.225, 123.012],
    [11.200, 122.998],
    [11.178, 122.975],
    [11.162, 122.948],
    [11.155, 122.918],
    [11.158, 122.888],
    [11.168, 122.858],
    [11.185, 122.833],
    [11.208, 122.820],
    [11.235, 122.818],
    [11.262, 122.825],
    [11.285, 122.840],
    [11.305, 122.858],
    [11.320, 122.870],
    [11.330, 122.880],
  ];

  // Outer glow ring
  L.polygon(LEMERY_BORDER, {
    color: '#22a06b',
    weight: 10,
    opacity: 0.2,
    fill: false,
    lineJoin: 'round',
    lineCap: 'round',
    smoothFactor: 2,
    interactive: false,
  }).addTo(map);

  // Main border line
  const borderLayer = L.polygon(LEMERY_BORDER, {
    color: '#22a06b',
    weight: 3,
    opacity: 0.95,
    fillColor: '#22a06b',
    fillOpacity: 0.08,
    lineJoin: 'round',
    lineCap: 'round',
    smoothFactor: 2,
    interactive: false,
  }).addTo(map);

  // Fit map to border bounds
  map.fitBounds(borderLayer.getBounds(), { padding: [32, 32], maxZoom: 13 });

  let allHerbs      = [];
  let markers       = {};
  let activeFilter  = '';
  let activeId      = null;
  let pinningHerbId = null;

  // ── Icon factory ──
  function makeIcon(emoji, selected = false) {
    return L.divIcon({
      className: '',
      html: `<div class="herb-marker${selected ? ' selected' : ''}">${emoji || '🌿'}</div>`,
      iconSize: [36, 36], iconAnchor: [18, 18], popupAnchor: [0, -20],
    });
  }

  // ── Popup HTML ──
  function popupHTML(h) {
    const tags   = (h.usesTags || []).slice(0, 3).map(t => `<span class="popup-tag">${t}</span>`).join('');
    const coords = h.lat && h.lng
      ? `<div class="popup-coords">📍 ${h.lat.toFixed(5)}, ${h.lng.toFixed(5)}</div>`
      : '';
    return `
      <div class="popup-header">
        <div class="popup-emoji">${h.emoji || '🌿'}</div>
        <div>
          <div class="popup-local">${h.localName}</div>
          <div class="popup-sci">${h.scientificName}</div>
        </div>
      </div>
      <div class="popup-body">
        <div class="popup-row"><i class="ti ti-tag"></i><span>${h.englishName || '—'}</span></div>
        <div class="popup-row"><i class="ti ti-map-pin"></i><span>${h.location || 'Lemery, Iloilo'}</span></div>
        ${coords}
        <div class="popup-tags">${tags}</div>
        <div class="popup-actions">
          <a class="popup-btn" href="herb-detail.html?id=${h.id}">View details →</a>
          <button class="popup-btn-remove" onclick="window._removePin('${h.id}')" title="Remove pin">
            <i class="ti ti-trash" style="font-size:14px"></i>
          </button>
        </div>
      </div>`;
  }

  // ── Add or update marker on map ──
  function placeMarker(h) {
    if (!h.lat || !h.lng) return;
    if (markers[h.id]) map.removeLayer(markers[h.id].marker);

    const marker = L.marker([h.lat, h.lng], { icon: makeIcon(h.emoji) })
      .addTo(map)
      .bindPopup(popupHTML(h), { maxWidth: 260 });

    marker.on('click', () => selectHerb(h.id));
    marker.on('popupclose', () => { if (activeId === h.id) deselectHerb(); });
    markers[h.id] = { marker, herb: h };
  }

  // ── Select herb ──
  function selectHerb(id) {
    if (activeId && markers[activeId])
      markers[activeId].marker.setIcon(makeIcon(markers[activeId].herb.emoji, false));

    activeId = id;
    if (markers[id]) {
      const { marker, herb } = markers[id];
      marker.setIcon(makeIcon(herb.emoji, true));
      map.setView(marker.getLatLng(), 15, { animate: true });
      marker.openPopup();
    }
    document.querySelectorAll('.herb-list-item').forEach(el =>
      el.classList.toggle('active', el.dataset.id === id));
    const el = document.querySelector(`.herb-list-item[data-id="${id}"]`);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function deselectHerb() {
    if (activeId && markers[activeId])
      markers[activeId].marker.setIcon(makeIcon(markers[activeId].herb.emoji, false));
    activeId = null;
    document.querySelectorAll('.herb-list-item').forEach(el => el.classList.remove('active'));
  }

  // ── START PIN MODE ──
  window._startPin = function(herbId) {
    pinningHerbId = herbId;
    const herb = allHerbs.find(h => h.id === herbId);
    document.getElementById('pinBanner').classList.add('active');
    document.getElementById('pinBannerText').textContent =
      `Click on the map to pin "${herb?.localName || 'herb'}"`;
    document.getElementById('mapLayout').classList.add('pinning');
    map.closePopup();
  };

  // ── CANCEL PIN MODE ──
  window.cancelPinMode = function() {
    pinningHerbId = null;
    document.getElementById('pinBanner').classList.remove('active');
    document.getElementById('mapLayout').classList.remove('pinning');
  };

  // ── MAP CLICK → place pin ──
  map.on('click', async function(e) {
    if (!pinningHerbId) return;

    const { lat, lng } = e.latlng;
    const herbId = pinningHerbId;
    cancelPinMode();

    const herb = allHerbs.find(h => h.id === herbId);
    if (!herb) return;
    herb.lat = lat;
    herb.lng = lng;

    placeMarker(herb);
    selectHerb(herbId);

    const btn = document.querySelector(`.pin-btn[data-id="${herbId}"]`);
    if (btn) {
      btn.classList.add('pinned');
      btn.innerHTML = `<i class="ti ti-map-pin-filled"></i> Pinned`;
    }

    showSaving(true);
    try {
      await updateDoc(doc(db, 'herbs', herbId), { lat, lng, pinnedAt: serverTimestamp() });
      showToast(`📍 ${herb.localName} pinned on the map!`);
    } catch(err) {
      showToast('Could not save location: ' + err.message, 'error');
    }
    showSaving(false);
  });

  // ── REMOVE PIN ──
  window._removePin = async function(herbId) {
    const herb = allHerbs.find(h => h.id === herbId);
    if (!herb) return;
    if (!confirm(`Remove pin for "${herb.localName}"?`)) return;

    map.closePopup();
    if (markers[herbId]) { map.removeLayer(markers[herbId].marker); delete markers[herbId]; }
    herb.lat = null; herb.lng = null;

    const btn = document.querySelector(`.pin-btn[data-id="${herbId}"]`);
    if (btn) { btn.classList.remove('pinned'); btn.innerHTML = `<i class="ti ti-map-pin"></i> Pin`; }

    showSaving(true);
    try {
      await updateDoc(doc(db, 'herbs', herbId), { lat: null, lng: null });
      showToast(`Pin removed for ${herb.localName}`);
    } catch(err) {
      showToast('Could not remove pin: ' + err.message, 'error');
    }
    showSaving(false);
  };

  // ── Render sidebar list ──
  function renderList(herbs) {
    const list = document.getElementById('herbList');
    if (!herbs.length) {
      list.innerHTML = `<div style="padding:2rem;text-align:center;color:var(--text-muted);font-size:13px">No herbs found.</div>`;
      return;
    }
    list.innerHTML = herbs.map(h => {
      const isPinned = !!(h.lat && h.lng);
      return `
        <div class="herb-list-item" data-id="${h.id}" onclick="window._selectHerb('${h.id}')">
          <div class="herb-list-emoji">${h.emoji || '🌿'}</div>
          <div class="herb-list-info">
            <div class="herb-list-local">${h.localName}</div>
            <div class="herb-list-sci">${h.scientificName}</div>
            <div class="herb-list-loc">
              <i class="ti ti-map-pin"></i>
              ${isPinned ? `${h.lat.toFixed(4)}, ${h.lng.toFixed(4)}` : 'No location yet'}
            </div>
          </div>
          <button class="pin-btn ${isPinned ? 'pinned' : ''}" data-id="${h.id}"
            onclick="event.stopPropagation(); window._startPin('${h.id}')"
            title="${isPinned ? 'Re-pin location' : 'Pin location on map'}">
            <i class="ti ti-map-pin${isPinned ? '-filled' : ''}"></i>
            ${isPinned ? 'Pinned' : 'Pin'}
          </button>
        </div>`;
    }).join('');
  }

  // ── Filters ──
  window.setFilter = function(use) {
    activeFilter = use;
    document.querySelectorAll('.pill').forEach(p =>
      p.classList.toggle('active', p.textContent.toLowerCase() === (use || 'all')));
    applyFilters();
  };
  window.filterList = function() { applyFilters(); };

  function applyFilters() {
    const q = document.getElementById('sidebarSearch').value.toLowerCase();
    const filtered = allHerbs.filter(h => {
      const matchQ = !q ||
        (h.localName || '').toLowerCase().includes(q) ||
        (h.englishName || '').toLowerCase().includes(q) ||
        (h.scientificName || '').toLowerCase().includes(q);
      const matchF = !activeFilter || (h.uses || []).includes(activeFilter);
      return matchQ && matchF;
    });
    Object.entries(markers).forEach(([id, { marker }]) => {
      const visible = filtered.find(h => h.id === id);
      if (visible) { if (!map.hasLayer(marker)) marker.addTo(map); }
      else          { if (map.hasLayer(marker))  map.removeLayer(marker); }
    });
    renderList(filtered);
    document.getElementById('countBadge').textContent = filtered.length;
  }

  window._selectHerb = selectHerb;

  // ── Load herbs from Firestore ──
  async function loadMap() {
    try {
      const snap = await getDocs(collection(db, 'herbs'));
      snap.forEach(d => allHerbs.push({ id: d.id, ...d.data() }));
      allHerbs.sort((a, b) => (a.no || 0) - (b.no || 0));
      allHerbs.forEach(h => { if (h.lat && h.lng) placeMarker(h); });
      renderList(allHerbs);
      document.getElementById('countBadge').textContent = allHerbs.length;

      const herbId = new URLSearchParams(location.search).get('herb');
      if (herbId) setTimeout(() => selectHerb(herbId), 400);
    } catch(e) {
      document.getElementById('herbList').innerHTML =
        `<div style="padding:1.5rem;text-align:center;font-size:13px;color:var(--text-muted)">
          Could not load herbs. Check Firebase connection.
        </div>`;
    }
  }
  loadMap();

  // ── Helpers ──
  function showSaving(on) {
    document.getElementById('savingDot').style.display = on ? 'block' : 'none';
  }

  function showToast(msg, type = 'ok') {
    let wrap = document.getElementById('toastWrap');
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.id = 'toastWrap';
      wrap.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;display:flex;flex-direction:column;gap:8px';
      document.body.appendChild(wrap);
    }
    const t = document.createElement('div');
    t.style.cssText = `background:${type === 'error' ? '#7f1d1d' : '#0a4a35'};color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;box-shadow:0 4px 20px rgba(0,0,0,0.2)`;
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  window.toggleSidebar = function() {
    const sidebar = document.getElementById('mapSidebar');
    const label   = document.getElementById('toggleLabel');
    const isOpen  = sidebar.classList.toggle('open');
    label.textContent = isOpen ? 'Hide list' : 'Show herb list';
  };
</script>
</body>
</html>
