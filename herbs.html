<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Herb Database — HerbID Iloilo</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css" />
  <style>
    .toolbar {
      background: var(--white); border-bottom: 1px solid var(--border);
      padding: 1rem 0; position: sticky; top: var(--nav-h); z-index: 100;
    }
    .toolbar-inner {
      max-width: 1100px; margin: 0 auto; padding: 0 1.5rem;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    }
    .search-wrap {
      position: relative; flex: 1; min-width: 220px;
    }
    .search-wrap i {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 17px; pointer-events: none;
    }
    .search-wrap input {
      width: 100%; padding: 9px 14px 9px 36px;
      border: 1px solid var(--border); border-radius: var(--radius-md);
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--text-primary); background: var(--bg);
    }
    .search-wrap input:focus {
      outline: none; border-color: var(--green-main);
      box-shadow: 0 0 0 3px rgba(34,160,107,0.1);
    }
    .filter-select {
      padding: 9px 12px; border: 1px solid var(--border);
      border-radius: var(--radius-md); font-size: 13px;
      font-family: 'DM Sans', sans-serif; background: var(--bg);
      color: var(--text-primary); cursor: pointer;
    }
    .filter-select:focus { outline: none; border-color: var(--green-main); }
    .result-count {
      font-size: 13px; color: var(--text-muted);
      margin-left: auto; white-space: nowrap;
    }

    /* GRID */
    .herb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px; padding: 2rem 0;
    }
    .herb-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
      cursor: pointer; text-decoration: none; color: inherit;
      display: block; transition: box-shadow 0.2s, transform 0.2s;
    }
    .herb-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
    .herb-card-img {
      height: 100px; background: var(--green-pale);
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; position: relative;
    }
    .herb-num {
      position: absolute; top: 8px; left: 10px;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--green-main); color: #fff;
      font-size: 10px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
    }
    .herb-card-body { padding: 12px 14px 14px; }
    .herb-local { font-size: 14px; font-weight: 600; color: var(--green-dark); }
    .herb-english { font-size: 12px; color: var(--text-muted); margin: 1px 0 3px; }
    .herb-sci { font-size: 11px; color: var(--text-light); font-style: italic; margin-bottom: 8px; }
    .herb-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .herb-loc {
      display: flex; align-items: center; gap: 4px;
      margin-top: 8px; font-size: 11px; color: var(--text-muted);
    }
    .herb-loc i { color: var(--green-main); font-size: 12px; }

    /* DETAIL DRAWER */
    .drawer-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 300;
    }
    .drawer-overlay.open { display: block; }
    .drawer {
      position: fixed; top: 0; right: -480px; bottom: 0;
      width: 100%; max-width: 460px;
      background: var(--white); z-index: 301;
      overflow-y: auto; transition: right 0.28s cubic-bezier(.4,0,.2,1);
      box-shadow: var(--shadow-lg);
    }
    .drawer.open { right: 0; }
    .drawer-hero {
      background: var(--green-dark); padding: 2rem 1.5rem 1.5rem;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      position: relative;
    }
    .drawer-close {
      position: absolute; top: 12px; right: 12px;
      background: rgba(255,255,255,0.12); border: none; cursor: pointer;
      color: #fff; width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 17px;
    }
    .drawer-close:hover { background: rgba(255,255,255,0.2); }
    .drawer-emoji { font-size: 60px; margin-bottom: 10px; }
    .drawer-local {
      font-family: 'Playfair Display', serif;
      font-size: 22px; font-weight: 700; color: #fff;
    }
    .drawer-english { font-size: 13px; color: rgba(255,255,255,0.6); margin: 2px 0 4px; }
    .drawer-sci { font-size: 13px; color: rgba(255,255,255,0.5); font-style: italic; }
    .drawer-body { padding: 1.5rem; }
    .detail-row { margin-bottom: 1.25rem; }
    .detail-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 5px;
    }
    .detail-val { font-size: 14px; color: var(--text-primary); line-height: 1.6; }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .detail-tags span { font-size: 12px; padding: 4px 10px; border-radius: 99px; }
    .loc-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--green-pale); color: var(--green-dark);
      padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 500;
    }
    .drawer-actions { display: flex; gap: 10px; padding: 0 1.5rem 1.5rem; }
    .drawer-actions .btn { flex: 1; justify-content: center; }
    /* ── MOBILE FIXES ── */
    @media (max-width: 640px) {
      .toolbar-inner { gap: 8px; }
      .search-wrap { min-width: 100%; }
      .filter-select { flex: 1; min-height: 44px; }
      .result-count { margin-left: 0; width: 100%; text-align: right; }

      .herb-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px; padding: 1.25rem 0;
      }
      .herb-card-img { height: 80px; font-size: 34px; }
      .herb-card-body { padding: 10px 10px 12px; }
      .herb-local { font-size: 13px; }
      .herb-english { font-size: 11px; }
      .herb-sci { font-size: 10px; }

      /* Drawer full-screen on mobile */
      .drawer {
        right: -100%;
        max-width: 100%;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        top: auto; height: 90vh;
      }
      .drawer.open { right: 0; }
      .drawer-overlay.open { display: block; }
      .drawer-hero { padding: 1.5rem 1.25rem 1.25rem; }
      .drawer-emoji { font-size: 44px; margin-bottom: 6px; }
      .drawer-local { font-size: 18px; }
      .drawer-body { padding: 1.25rem; }
      .drawer-actions { padding: 0 1.25rem 1.25rem; flex-direction: column; }
      .drawer-actions .btn { min-height: 48px; }
    }
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <a href="index.html" class="nav-brand">
    <div class="nav-brand-icon"><i class="ti ti-leaf"></i></div>
    <div class="nav-brand-text">
      <strong>HerbID Iloilo</strong>
      <span>NISU Lemery Campus</span>
    </div>
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li>
    <li><a href="herbs.html" class="active">Herb Database</a></li>
    <li><a href="identify.html">Identify Herb</a></li>
    <li><a href="map.html">Map</a></li>
    <li><a href="about.html">About</a></li>
  </ul>
  <button class="nav-hamburger" onclick="document.getElementById('navLinks').classList.toggle('open')" aria-label="Menu">
    <i class="ti ti-menu-2"></i>
  </button>
</nav>

<!-- PAGE HERO -->
<div class="page-hero">
  <div class="page-hero-badge"><i class="ti ti-database"></i> Herb Database</div>
  <h1>Medicinal Herbs of Iloilo</h1>
  <p>18 documented species with local names, scientific data, uses, and preparation methods</p>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="toolbar-inner">
    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" id="searchInput" placeholder="Search by local name, English name, or use…" oninput="filterHerbs()" />
    </div>
    <select class="filter-select" id="useFilter" onchange="filterHerbs()">
      <option value="">All uses</option>
      <option value="fever">Fever</option>
      <option value="wound">Wound / Cuts</option>
      <option value="pain">Pain relief</option>
      <option value="digestive">Digestive</option>
      <option value="respiratory">Respiratory</option>
      <option value="skin">Skin</option>
      <option value="urinary">Urinary</option>
      <option value="anti-inflammatory">Anti-inflammatory</option>
    </select>
    <span class="result-count" id="resultCount"></span>
  </div>
</div>

<!-- HERB GRID -->
<div class="container section">
  <div class="herb-grid" id="herbGrid">
    <div class="spinner" style="grid-column:1/-1"></div>
  </div>
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="empty-state-icon">🔍</div>
    <h3>No herbs found</h3>
    <p>Try a different search or clear your filters.</p>
  </div>
</div>

<!-- DETAIL DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Herb detail">
  <div class="drawer-hero">
    <button class="drawer-close" onclick="closeDrawer()"><i class="ti ti-x"></i></button>
    <div class="drawer-emoji" id="d-emoji"></div>
    <div class="drawer-local" id="d-local"></div>
    <div class="drawer-english" id="d-english"></div>
    <div class="drawer-sci" id="d-sci"></div>
  </div>
  <div class="drawer-body">
    <div class="detail-row">
      <div class="detail-label">Plant family</div>
      <div class="detail-val" id="d-family"></div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Medicinal uses</div>
      <div class="detail-tags" id="d-useTags"></div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Parts used</div>
      <div class="detail-val" id="d-parts"></div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Preparation method</div>
      <div class="detail-val" id="d-prep"></div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Location in Iloilo</div>
      <div><span class="loc-chip"><i class="ti ti-map-pin"></i><span id="d-loc"></span></span></div>
    </div>
  </div>
  <div class="drawer-actions">
    <a href="#" id="d-mapLink" class="btn btn-outline btn-sm">
      <i class="ti ti-map"></i> View on map
    </a>
    <a href="#" id="d-detailLink" class="btn btn-primary btn-sm">
      Full details <i class="ti ti-arrow-right"></i>
    </a>
  </div>
</aside>

<footer class="footer">
  <p><strong>HerbID Iloilo</strong> — BSIT Capstone Project · NISU Lemery Campus · 2024–2025</p>
</footer>

<div class="toast-wrap" id="toastWrap"></div>

<script type="module">
  import { db, collection, getDocs } from './js/firebase-config.js';

  let allHerbs = [];

  // Tag class map
  const tagClass = {
    fever:'tag-fever', wound:'tag-wound', pain:'tag-pain',
    digestive:'tag-digestive', respiratory:'tag-respiratory',
    skin:'tag-skin', urinary:'tag-urinary', 'anti-inflammatory':'tag-anti-inflammatory'
  };
  const useLabel = {
    fever:'Fever', wound:'Wound', pain:'Pain', digestive:'Digestive',
    respiratory:'Respiratory', skin:'Skin', urinary:'Urinary',
    'anti-inflammatory':'Anti-inflammatory'
  };

  // ── Fetch herbs from Firestore ──
  async function loadHerbs() {
    try {
      const snap = await getDocs(collection(db, 'herbs'));
      allHerbs = [];
      snap.forEach(d => allHerbs.push({ id: d.id, ...d.data() }));
      allHerbs.sort((a, b) => (a.no || 0) - (b.no || 0));
      renderHerbs(allHerbs);
    } catch(e) {
      document.getElementById('herbGrid').innerHTML =
        `<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:3rem">
          <i class="ti ti-alert-circle" style="font-size:32px;display:block;margin-bottom:1rem;color:#e53e3e"></i>
          Could not connect to Firebase. Check your config in <code>js/firebase-config.js</code>.
        </div>`;
    }
  }

  function renderHerbs(herbs) {
    const grid = document.getElementById('herbGrid');
    const empty = document.getElementById('emptyState');
    document.getElementById('resultCount').textContent = `${herbs.length} herb${herbs.length !== 1 ? 's' : ''}`;

    if (!herbs.length) {
      grid.innerHTML = '';
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';

    grid.innerHTML = herbs.map(h => `
      <div class="herb-card" onclick="openDrawer('${h.id}')" tabindex="0" role="button" aria-label="${h.localName}">
        <div class="herb-card-img">
          ${h.imageUrl
            ? `<img src="${h.imageUrl}" alt="${h.localName}" style="width:100%;height:100%;object-fit:cover;">`
            : (h.emoji || '🌿')}
          <div class="herb-num">${h.no || ''}</div>
        </div>
        <div class="herb-card-body">
          <div class="herb-local">${h.localName}</div>
          <div class="herb-english">${h.englishName || ''}</div>
          <div class="herb-sci">${h.scientificName}</div>
          <div class="herb-tags">
            ${(h.uses || []).slice(0,2).map(u =>
              `<span class="tag ${tagClass[u] || ''}">${useLabel[u] || u}</span>`).join('')}
          </div>
          <div class="herb-loc">
            <i class="ti ti-map-pin"></i>
            ${(h.location || '').split(',')[0]}
          </div>
        </div>
      </div>`).join('');
  }

  // ── Filter ──
  window.filterHerbs = function() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const f = document.getElementById('useFilter').value;
    const filtered = allHerbs.filter(h => {
      const matchQ = !q ||
        (h.localName || '').toLowerCase().includes(q) ||
        (h.englishName || '').toLowerCase().includes(q) ||
        (h.scientificName || '').toLowerCase().includes(q) ||
        (h.useTags || []).some(t => t.toLowerCase().includes(q));
      const matchF = !f || (h.uses || []).includes(f);
      return matchQ && matchF;
    });
    renderHerbs(filtered);
  };

  // ── Drawer ──
  window.openDrawer = function(id) {
    const h = allHerbs.find(x => x.id === id);
    if (!h) return;
    document.getElementById('d-emoji').textContent   = h.emoji || '🌿';
    document.getElementById('d-local').textContent   = h.localName;
    document.getElementById('d-english').textContent = h.englishName || '';
    document.getElementById('d-sci').textContent     = h.scientificName;
    document.getElementById('d-family').textContent  = h.family || '—';
    document.getElementById('d-parts').textContent   = h.parts || '—';
    document.getElementById('d-prep').textContent    = h.preparation || '—';
    document.getElementById('d-loc').textContent     = h.location || '—';
    document.getElementById('d-useTags').innerHTML   =
      (h.useTags || []).map(t => `<span class="tag tag-anti-inflammatory">${t}</span>`).join('');
    document.getElementById('d-mapLink').href   = `map.html?herb=${id}`;
    document.getElementById('d-detailLink').href = `herb-detail.html?id=${id}`;
    document.getElementById('drawerOverlay').classList.add('open');
    document.getElementById('drawer').classList.add('open');
  };

  window.closeDrawer = function() {
    document.getElementById('drawerOverlay').classList.remove('open');
    document.getElementById('drawer').classList.remove('open');
  };

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

  loadHerbs();
</script>
</body>
</html>
